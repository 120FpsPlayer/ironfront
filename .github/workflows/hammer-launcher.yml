name: Hammer Launcher

on:
  push:
    paths:
      - 'hammer-launcher/**'
      - 'hammer-client/**'
      - '.github/workflows/hammer-launcher.yml'
  pull_request:
    paths:
      - 'hammer-launcher/**'
      - 'hammer-client/**'
  workflow_dispatch:

concurrency:
  group: launcher-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: hammer-launcher

jobs:
  test:
    name: Testy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hammer-launcher/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Składnia interfejsu
        run: for f in src/renderer/js/*.js src/renderer/views/*.js src/preload.js; do node --check "$f"; done
      - name: Podgląd interfejsu (Chromium, bez błędów w konsoli)
        run: |
          for i in 1 2 3; do npx playwright install --with-deps chromium && break; echo "Instalacja Chromium nie powiodła się (próba $i) – ponawiam"; sleep 30; done
          node scripts/preview.js preview 1
      - name: Podgląd interfejsu po angielsku (bez polskich tekstów na ekranie)
        run: node scripts/preview.js preview-en 1 --lang=en
      # Zrzuty są tylko do obejrzenia – awaria magazynu plików GitHuba nie może zatrzymać budowania instalatora.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: podglad-interfejsu
          path: |
            hammer-launcher/preview/*.png
            hammer-launcher/preview-en/*.png
          retention-days: 14

  changes:
    name: Co się zmieniło
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mod: ${{ steps.diff.outputs.mod }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        working-directory: .
        shell: bash
        run: |
          # The per-version game test of the mod (17 jobs) only runs when the mod or this workflow changed.
          base="${{ github.event.before }}"
          if [ "${{ github.event_name }}" != "push" ] || [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "mod=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$base" "${{ github.sha }}" | grep -qE '^(hammer-client/|\.github/workflows/hammer-launcher\.yml)'; then
            echo "mod=true" >> "$GITHUB_OUTPUT"
          else
            echo "mod=false" >> "$GITHUB_OUTPUT"
          fi

  mod:
    name: Hammer Client (mod Fabric, Minecraft 1.21 – 26.3)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: hammer-client
    outputs:
      versions: ${{ steps.versions.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Budowanie (jeden jar na wersję gry) i testy
        shell: bash
        run: |
          # Maven Central sometimes answers 429 to CI runners – try again instead of failing the whole run.
          for attempt in 1 2 3; do
            ./gradlew build dist --no-daemon --stacktrace && exit 0
            echo "::warning::Budowanie nie powiodło się (próba $attempt) – ponawiam za 30 s"
            sleep 30
          done
          exit 1
      - run: ls -la build/dist && cat build/dist/versions.json
      - id: versions
        name: Lista wersji gry do testu
        run: echo "list=$(jq -c '[.jars[].minecraft[]]' build/dist/versions.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: hammer-client
          path: hammer-client/build/dist/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: podglad-hammer-client
          path: hammer-client/common/build/preview/*.png
          retention-days: 14

  mod-live:
    name: Hammer Client w grze (${{ matrix.mc }})
    needs: [changes, mod]
    if: needs.changes.outputs.mod == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        mc: ${{ fromJson(needs.mod.outputs.versions) }}
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hammer-launcher/package-lock.json
      - name: Xvfb i Mesa (OpenGL i Vulkan bez karty graficznej – Minecraft 26.3+ potrzebuje Vulkana)
        # Serwery paczek Ubuntu bywają chwilowo niedostępne z maszyn GitHuba – kilka prób zamiast czerwonego testu.
        run: |
          for i in 1 2 3 4 5; do
            sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers libxrandr2 libxxf86vm1 libxcursor1 libxi6 >/dev/null && break
            echo "Instalacja paczek nie powiodła się (próba $i) – czekam i ponawiam"; sleep 30
          done
          command -v Xvfb
      - uses: actions/download-artifact@v4
        with:
          name: hammer-client
          path: hammer-launcher/resources/hammer-client
      - run: npm ci
      - name: Start gry z Hammer Client (menu główne musi się otworzyć)
        run: xvfb-run -a -s "-screen 0 1280x720x24" node scripts/live-check.js
        env:
          HAMMER_CLIENT_DIR: resources/hammer-client
          HAMMER_CLIENT_ONLY: '1'
          MC_VERSION: ${{ matrix.mc }}

  live-linux:
    name: Test na żywo (Linux, start gry)
    needs: [test, mod]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hammer-launcher/package-lock.json
      - name: Xvfb i Mesa (OpenGL i Vulkan bez karty graficznej – Minecraft 26.3+ potrzebuje Vulkana)
        # Serwery paczek Ubuntu bywają chwilowo niedostępne z maszyn GitHuba – kilka prób zamiast czerwonego testu.
        run: |
          for i in 1 2 3 4 5; do
            sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers libxrandr2 libxxf86vm1 libxcursor1 libxi6 >/dev/null && break
            echo "Instalacja paczek nie powiodła się (próba $i) – czekam i ponawiam"; sleep 30
          done
          command -v Xvfb
      - uses: actions/download-artifact@v4
        with:
          name: hammer-client
          path: hammer-launcher/resources/hammer-client
      - name: Hammer Client w launcherze
        shell: bash
        run: ls -la resources/hammer-client
      - run: npm ci
      - run: xvfb-run -a -s "-screen 0 1280x720x24" node scripts/live-check.js
        env:
          HAMMER_CLIENT_DIR: resources/hammer-client

  live-windows:
    name: Test na żywo (Windows)
    needs: [test, mod]
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hammer-launcher/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: hammer-client
          path: hammer-launcher/resources/hammer-client
      - name: Hammer Client w launcherze
        shell: bash
        run: ls -la resources/hammer-client
      - run: npm ci
      - run: npm test
      - run: node scripts/live-check.js --no-game
        env:
          HAMMER_CLIENT_DIR: resources/hammer-client

  build-windows:
    name: Instalator Windows (.exe)
    needs: [test, mod]
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hammer-launcher/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: hammer-client
          path: hammer-launcher/resources/hammer-client
      - name: Hammer Client w launcherze
        shell: bash
        run: ls -la resources/hammer-client
      - run: npm ci
      - run: npm run dist:win
      # The packaged app is hardened (Electron fuses, asar integrity) – it must still start after that.
      - name: Zabezpieczenia pliku exe i start spakowanej aplikacji
        shell: bash
        run: |
          npx --no-install electron-fuses read --app "dist/win-unpacked/Hammer Launcher.exe"
          "dist/win-unpacked/Hammer Launcher.exe" &
          sleep 25
          if tasklist //FI "IMAGENAME eq Hammer Launcher.exe" | grep -qi "Hammer Launcher.exe"; then
            echo "Spakowany launcher uruchomił się i działa."
            taskkill //F //T //IM "Hammer Launcher.exe" || true
          else
            echo "::error::Spakowany launcher zakończył się zaraz po starcie."
            exit 1
          fi
      # Signed releases (optional): with the secret UPDATE_SIGNING_KEY the installer gets a .sig next to it – its
      # content goes into "Podpis wydania" in the website's admin panel (hammer-launcher/README.md → Aktualizacje launchera).
      - name: Podpis wydania (jeśli ustawiono UPDATE_SIGNING_KEY)
        shell: bash
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$UPDATE_SIGNING_KEY" ]; then echo "Brak sekretu UPDATE_SIGNING_KEY – wydanie bez podpisu."; exit 0; fi
          for f in dist/Hammer-Launcher-Setup-*.exe; do node scripts/sign-release.js "$f" > /dev/null; ls -la "$f.sig"; done
      - uses: actions/upload-artifact@v4
        with:
          name: Hammer-Launcher-Windows
          path: |
            hammer-launcher/dist/*.exe
            hammer-launcher/dist/*.exe.blockmap
            hammer-launcher/dist/*.exe.sig
            hammer-launcher/dist/latest.yml
          if-no-files-found: error
          retention-days: 30
