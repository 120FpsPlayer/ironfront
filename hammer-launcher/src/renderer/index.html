<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data: file:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; connect-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hammer Launcher</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" class="booting">
    <header class="titlebar">
      <div class="tb-brand"><img src="assets/hammer-mark.png" alt=""><span>Hammer <b>Launcher</b></span><em>by HammerShop</em><i class="tb-slash" aria-hidden="true"></i><span class="tb-dev">developed by <strong>120FpsPlayer</strong></span></div>
      <div class="tb-drag"></div>
      <div class="tb-extra"><button class="tb-plus" id="tb-plus" type="button" aria-label="Hammer+"></button></div>
      <div class="tb-buttons">
        <button class="tb-btn" data-win="minimize" title="Minimalizuj" aria-label="Minimalizuj"></button>
        <button class="tb-btn" data-win="maximize" title="Maksymalizuj" aria-label="Maksymalizuj"></button>
        <button class="tb-btn tb-close" data-win="close" title="Zamknij" aria-label="Zamknij"></button>
      </div>
    </header>
    <div class="shell">
      <div class="backdrop" id="backdrop" aria-hidden="true"><div class="fx live"></div></div>
      <nav class="sidebar" aria-label="Menu">
        <div class="nav" id="nav"></div>
        <div class="sidebar-foot" id="sidebar-foot"></div>
      </nav>
      <main id="view" class="view" tabindex="-1"></main>
    </div>
    <div id="toasts" class="toasts" aria-live="polite"></div>
    <div id="modal-root"></div>
  </div>
  <script src="js/icons.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/core.js"></script>
  <script src="views/plus.js"></script>
  <script src="views/home.js"></script>
  <script src="views/instances.js"></script>
  <script src="views/mods.js"></script>
  <script src="views/servers.js"></script>
  <script src="views/worlds.js"></script>
  <script src="views/optimize.js"></script>
  <script src="views/gallery.js"></script>
  <script src="views/skin.js"></script>
  <script src="views/console.js"></script>
  <script src="views/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
