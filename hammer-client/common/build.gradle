plugins {
    id 'java-library'
}

repositories {
    mavenCentral()
}

dependencies {
    // Provided by Minecraft at runtime.
    compileOnly 'com.google.code.gson:gson:2.10.1'
    compileOnly 'org.slf4j:slf4j-api:2.0.9'

    testImplementation 'com.google.code.gson:gson:2.10.1'
    testImplementation 'org.slf4j:slf4j-api:2.0.9'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

// The version shown in the menus.
processResources {
    def v = rootProject.mod_version
    inputs.property 'version', v
    doLast {
        new File(destinationDir, 'hammerclient.properties').text = "version=${v}\n"
    }
}

test {
    useJUnitPlatform()
    systemProperty 'java.awt.headless', 'true'
    systemProperty 'hammer.preview.dir', layout.buildDirectory.dir('preview').get().asFile.absolutePath
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}
